<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="candor — a data sufficiency and quality gate for AI agents">
  <title>candor</title>
  <defs>
    <style>
      .w { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 124px; letter-spacing: -4px; fill: #f3f4f6; }
      .t { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 32px; fill: #9ca3af; }
      .k { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; font-size: 23px; fill: #6b7280; letter-spacing: 1.6px; }
      .a { fill: #fbbf24; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="5" fill="#fbbf24"/>

  <g transform="translate(96, 196) scale(2.5)">
    <rect x="4"  y="31" width="12" height="22" rx="3" fill="#e5e7eb"/>
    <rect x="20" y="21" width="12" height="32" rx="3" fill="#e5e7eb"/>
    <rect x="37.3" y="25.3" width="11.4" height="27.4" rx="2.7"
          fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="2.6"/>
    <rect x="52" y="14" width="12" height="39" rx="3" fill="#e5e7eb"/>
    <circle cx="43" cy="9.5" r="3.4" fill="#fbbf24"/>
    <rect x="3" y="56.5" width="61" height="3" rx="1.5" fill="#e5e7eb" opacity="0.3"/>
  </g>

  <text class="w" x="292" y="330">candor<tspan class="a">.</tspan></text>
  <text class="t" x="298" y="390">A data sufficiency and quality gate for AI agents.</text>
  <text class="t" x="298" y="434">It tells an agent when the data can&#8217;t support an answer.</text>

  <text class="k" x="298" y="536">ASSESS<tspan fill="#fbbf24">  ·  </tspan>VERIFY<tspan fill="#fbbf24">  ·  </tspan>IMPROVE</text>
  <text class="k" x="298" y="576" fill="#6b7280">MCP SERVER<tspan fill="#4b5563">  ·  </tspan>CLI<tspan fill="#4b5563">  ·  </tspan>PYTHON<tspan fill="#4b5563">  ·  </tspan>NO MODEL CALLS</text>
</svg>
