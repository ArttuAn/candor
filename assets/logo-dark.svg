<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 190" width="820" height="190" role="img" aria-label="candor — stops an agent answering from data that cannot support it">
  <title>candor</title>
  <defs>
    <style>
      .wordmark { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 76px; letter-spacing: -2.5px; fill: #f3f4f6; }
      .tagline  { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; letter-spacing: 0.1px; fill: #9ca3af; }
      .accent   { fill: #fbbf24; }
    </style>
  </defs>

  <!-- Three bars that were loaded and one that never was. -->
  <g transform="translate(40, 46) scale(1.45)">
    <rect x="4"  y="31" width="12" height="22" rx="3" fill="#e5e7eb"/>
    <rect x="20" y="21" width="12" height="32" rx="3" fill="#e5e7eb"/>
    <rect x="37.3" y="25.3" width="11.4" height="27.4" rx="2.7"
          fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="2.6"/>
    <rect x="52" y="14" width="12" height="39" rx="3" fill="#e5e7eb"/>
    <circle cx="43" cy="9.5" r="3.4" fill="#fbbf24"/>
    <rect x="3" y="56.5" width="61" height="3" rx="1.5" fill="#e5e7eb" opacity="0.3"/>
  </g>

  <text class="wordmark" x="184" y="104">candor<tspan class="accent">.</tspan></text>
  <text class="tagline"  x="188" y="140">Stops an agent answering from data that can&#8217;t support it.</text>
</svg>
