[project]
name = "candor"
version = "0.1.0"
description = "Data sufficiency and quality gate for AI agents — tells an agent when the data cannot support an answer, and what would fix it."
readme = "README.md"
authors = [{ name = "arttuan", email = "arttu.antikainen@outlook.com" }]
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agents", "mcp", "data-quality", "hallucination", "grounding", "llm"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
parquet = ["pyarrow>=15.0"]

[project.scripts]
candor = "candor.cli:main"
candor-mcp = "candor.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["candor", "helpers"]
