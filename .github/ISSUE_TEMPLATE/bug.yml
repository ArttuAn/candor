name: Bug
description: Something crashed, or behaved differently from the docs
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: candor version and Python version
      placeholder: "candor 0.1.0, Python 3.12"
