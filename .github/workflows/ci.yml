name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra mcp --python ${{ matrix.python-version }}
      - run: uv run ruff check src tests
      - run: uv run pytest -q --cov=candor --cov-report=term-missing --cov-fail-under=85

  # The examples are part of the documentation; if they stop working the README
  # is lying.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run candor profile examples/messy_orders.csv || [ $? -le 2 ]
      - run: uv run candor assess examples/messy_orders.csv -q "Why did revenue drop in Q3 2023?" || [ $? -le 2 ]
      # `--as-of` pins freshness to the snapshot's last day. Without it this
      # example fails purely by the calendar: the data is fixed, today is not.
      - run: uv run candor gate examples/clean_orders.csv --min-grade D --as-of 2025-08-22
